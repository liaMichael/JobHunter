name: JobHunter Scraper

on:
  schedule:
    # Runs at 07:17, 10:17, 13:17, 16:17, and 19:17 (Israel Winter Time)
    - cron: '*/15 * * * *' 
  workflow_dispatch: # Allows you to run a manual test via the GitHub interface

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Critical permission that allows the runner to push back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chrome
          playwright install-deps

      - name: Run scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: python main.py