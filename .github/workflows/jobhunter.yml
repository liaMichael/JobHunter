name: JobHunter Scraper

on:
  schedule:
    - cron: '0 */3 * * *' # Runs every 3 hours
  workflow_dispatch: # Allows you to run a manual test via the GitHub interface

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Critical permission that allows the runner to push back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Run scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Commit and push seen_jobs.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_jobs.json
          # This condition ensures a commit is made only if the file actually changed
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update seen jobs" && git push)